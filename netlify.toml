[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: send all routes (e.g. /products/allison) to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache media and hashed build assets in the browser so repeat visits are instant
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
